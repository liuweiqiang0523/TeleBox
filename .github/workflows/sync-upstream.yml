name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Merge upstream/main while preserving fork updater
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/TeleBoxOrg/TeleBox.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already contains upstream/main."
            exit 0
          fi

          # The server must update only from this maintained fork (origin).
          # Preserve that audited policy even when upstream changes update.ts
          # without producing a textual conflict.
          cp src/plugin/update.ts "$RUNNER_TEMP/fork-update.ts"

          if ! git merge --no-edit upstream/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            non_updater_conflicts="$(printf '%s\n' "$conflicts" | grep -v '^src/plugin/update.ts$' || true)"
            if [ -n "$non_updater_conflicts" ]; then
              {
                echo "## Upstream sync blocked"
                echo
                echo "The fork was left unchanged because these files require review:"
                echo '```'
                echo "$non_updater_conflicts"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              git merge --abort || true
              exit 1
            fi

            # update.ts is the only allowed automatic conflict: keep the
            # fork's origin-only updater and finish the merge safely.
            git checkout --ours src/plugin/update.ts
            git add src/plugin/update.ts
            git commit --no-edit
          fi

          # Also restore it when Git auto-merged upstream's version cleanly.
          cp "$RUNNER_TEMP/fork-update.ts" src/plugin/update.ts
          git add src/plugin/update.ts
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Type check merged code
        run: ./node_modules/.bin/tsc --noEmit --pretty false

      - name: Push verified sync
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "Fork is already up to date."
            exit 0
          fi
          git push origin HEAD:main
